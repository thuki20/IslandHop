# 临时探针：验证本账号能否分配 macOS runner（三个标签并行，各跑一个 echo）。
# 结果用途：确认 GitHub Actions 的 macOS 池对本仓库是否可用。用完即删。
name: Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 环境自检
        run: |
          sw_vers
          uname -m
          echo "RUNNER_OK ${{ matrix.os }}"
