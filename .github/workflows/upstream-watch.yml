# 上游（岛仔 xiaotang-daozai）更新巡检。
# 每周一 09:00（北京时间）比对一次，有新提交就开 issue 提醒，避免漏掉上游的 bug 修复。
# 手动触发：Actions → Upstream watch → Run workflow。
name: Upstream watch

on:
  schedule:
    - cron: "0 1 * * 1"   # UTC 01:00 = Asia/Shanghai 09:00，每周一
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 比对上游进度
        id: cmp
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < .upstream-base)
          echo "baseline=$BASE"
          curl -fsSL "https://api.github.com/repos/Renly1994/xiaotang-daozai/compare/${BASE}...main" -o compare.json
          AHEAD=$(python3 -c "import json;print(json.load(open('compare.json')).get('ahead_by',0))")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          python3 - "$BASE" <<'PY' > issue-body.md
          import json,sys
          base=sys.argv[1]
          d=json.load(open('compare.json'))
          commits=d.get('commits',[])
          files=d.get('files',[])
          print(f"上游 `Renly1994/xiaotang-daozai` 自基线 **{base}** 起有 **{d.get('ahead_by',0)}** 个新提交")
          print()
          print("**最近提交**")
          print()
          for c in commits[-15:]:
              msg=c['commit']['message'].splitlines()[0][:90]
              print(f"- `{c['sha'][:8]}` {msg}")
          if files:
              print()
              print("**改动文件（前 20）**")
              print()
              for f in files[:20]:
                  print(f"- `{f['filename']}` +{f['additions']}/-{f['deletions']}")
          print()
          print("---")
          print()
          print("本地合并：")
          print()
          print("```bash")
          print("bash scripts/upstream-sync.sh            # 出报告")
          print("bash scripts/upstream-sync.sh apply --test   # 应用可直接吃的改动并跑测试")
          print("```")
          print()
          print("流程与文件归属见 `UPSTREAM.md`。")
          PY
          cat issue-body.md

      - name: 有新提交才开 issue
        if: steps.cmp.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(tr -d '[:space:]' < .upstream-base)
          TITLE="上游岛仔有 ${{ steps.cmp.outputs.ahead }} 个新提交（基线 ${BASE}）"
          # 已有同类 open issue 就只更新正文，不重复开
          EXISTING=$(gh issue list --state open --search "上游岛仔有 in:title" --json number --jq '.[0].number // empty')
          gh label create upstream --description "上游同步" --color 0e8a16 >/dev/null 2>&1 || true
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
            echo "已在 issue #$EXISTING 追加评论"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md --label "upstream"
          fi
