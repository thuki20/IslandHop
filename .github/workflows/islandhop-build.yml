# IslandHop 构建流水线（Windows）。
# 目标：push 到 main 即自动产出可安装的 Win 包，并挂到与 macOS 同一个 GitHub Release。
#
# 产物（dist/）：
#   IslandHop-Setup-v<版本>-x64.exe     安装版（NSIS，日常下载这个：固定目录+快捷方式+覆盖升级保留数据）
#   IslandHop-v<版本>-windows-x64.zip   便携版（解压即用，应用内更新也认这个包）
#   manifest-windows.json               应用内更新清单（自有 feed 优先读它，url 指向 zip）
#   SHA256SUMS.txt                      校验和
#
# 与 release-macos.yml 交替上传同一个 tag（v<版本>）的资产：谁先跑完谁先建
# Release，后到的只补自己的文件，不会清掉对方的更新说明（这里不写 body）。
#
# 上游 .github/workflows/ci.yml 保持原样（完整测试 + 安装/升级/卸载回归）。
name: IslandHop Build (Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "installer/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/islandhop-build.yml"
  workflow_dispatch:
    inputs:
      notes:
        description: "更新说明（留空则用默认文案；仅手动触发时生效）"
        required: false
        default: ""

permissions:
  contents: write   # 需要创建/更新 Release 并上传资产

# 同一时刻只跑一个 Windows 打包，避免两次运行同时写同一批资产
concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # windows-latest 内存有限，上游 ci.yml 同样限到 1 个并行编译单元
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: 读取版本号
        id: meta
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw "Cargo.toml 里没读到 version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "本次出包版本：v$version"

      - name: 构建 + 打包（安装包 + 便携 zip + 校验和）
        shell: pwsh
        run: |
          # package.ps1 用 --locked 构建；版本号 bump 后锁文件若没同步会直接失败。
          # 这里先刷一遍锁文件（只补版本号，不改依赖版本），再打包。
          cargo metadata --format-version 1 | Out-Null
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -NsisCompiler $compiler
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: 校验产物
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $setup = "dist/IslandHop-Setup-v$env:VERSION-x64.exe"
          $zip = "dist/IslandHop-v$env:VERSION-windows-x64.zip"
          foreach ($f in @($setup, $zip, "dist/SHA256SUMS.txt", "dist/manifest-windows.json")) {
            if (-not (Test-Path $f)) { throw "缺少产物：$f" }
            $size = (Get-Item $f).Length
            if ($size -lt 1MB -and $f -ne "dist/SHA256SUMS.txt" -and $f -ne "dist/manifest-windows.json") { throw "产物过小，疑似构建失败：$f ($size bytes)" }
            Write-Output ("{0}  {1:N1} MB" -f $f, ($size / 1MB))
          }
          $mf = Get-Content "dist/manifest-windows.json" -Raw | ConvertFrom-Json
          $zipLeaf = [IO.Path]::GetFileName($zip)
          if ($mf.version -ne $env:VERSION -or -not $mf.url.EndsWith($zipLeaf)) { throw "manifest-windows.json 版本或包名不符" }
          if ($mf.sha256.Length -ne 64 -or $mf.size -le 0) { throw "manifest-windows.json 校验字段缺失" }

      - uses: actions/upload-artifact@v4
        with:
          name: IslandHop-windows-${{ github.run_number }}
          path: |
            dist/IslandHop-Setup-*.exe
            dist/IslandHop-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/manifest-windows.json
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          # 不写 body：更新说明由 macOS 工作流维护，这里只补 Windows 资产
          files: |
            dist/IslandHop-Setup-*.exe
            dist/IslandHop-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/manifest-windows.json
          fail_on_unmatched_files: true
          overwrite_files: true
          # 必须标记为 Latest：≤0.6.77 的客户端只查 GitHub releases/latest，
          # 不标记的话它们永远看到旧版本、提示「当前已是最新版本」。
          make_latest: true
