# IslandHop 构建流水线。
# 上游 .github/workflows/ci.yml 保持原样（测试与 NSIS 安装包），本文件只负责出可运行包。
# macOS runner 在此账号下 push 时拿不到（两次 0-step cancelled），macOS 包固定本机出。
name: IslandHop Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --bin IslandHop --target x86_64-pc-windows-msvc

      - name: Verify PE icon resource
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/IslandHop.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          Write-Output "PE size: $($bytes.Length) bytes"
          if ($bytes.Length -lt 1MB) { throw "binary suspiciously small" }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/IslandHop.exe" dist/
          Compress-Archive -Path "dist/IslandHop.exe" -DestinationPath "dist/IslandHop-Windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: IslandHop-Windows-x64
          path: dist/IslandHop-Windows-x64.zip
          if-no-files-found: error
