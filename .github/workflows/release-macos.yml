# macOS 云端发版：在 GitHub 的 Apple Silicon runner 上编译 → 签名 → 打包 → 推云端 OTA。
#
# 使用方式（Windows 上也能操作，不需要 Mac）：
#   1) 改代码，把 Cargo.toml 的 [workspace.package] 和 [package] 两处 version 一起 bump，
#      在 CHANGELOG.md 顶部加一节；
#   2) push 到 main（或手动 Actions → Release macOS → Run workflow 填更新说明）；
#   3) 本流水线编译、签名、打包、生成 manifest、rsync 到 203.195.201.85；
#   4) 已装客户端下次启动自动检查 → 弹窗 → 下载 → 换包重启。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   MACOS_CERT_P12      OpenHopSign 证书导出的 .p12 做 base64 后的文本
#   MACOS_CERT_PASSWORD 该 .p12 的导出密码
#   DEPLOY_SSH_KEY      能 ssh 到 ubuntu@203.195.201.85 的私钥（建议专用 deploy key）
# 缺任何一个都不会失败：没有证书走 ad-hoc 签名（用户需重新授权辅助功能），
# 没有 SSH 只出包不推云端（产物在 Actions artifact 里）。
name: Release macOS (OTA)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "更新说明（可多行，每行一条；留空则用默认文案）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-macos.yml"

permissions:
  contents: write   # 需要创建 Release 并上传 zip/manifest

# 同一时刻只跑一个发版，避免两条流水线交叉写 manifest
concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    # macos-15 = Apple Silicon (arm64)，与目标机型一致；公开仓库的 macOS runner 免费。
    # 不要用 macos-14：本仓库实测该标签 1 秒内 cancelled（0 steps，runner 未分配），
    # 同一次探针里 macos-15 正常跑通、macos-13 长期 queued。可用仓库变量覆盖。
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: 环境与磁盘余量
        run: |
          sw_vers
          uname -m
          df -h / | tail -2

      - name: 检查版本是否已提升
        env:
          FEED: https://203.195.201.85/home/updates/islandhop/manifest.json
        run: |
          LOCAL=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          REMOTE=$(curl -fsS --max-time 20 "$FEED" 2>/dev/null \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('version','0.0.0'))" 2>/dev/null || echo 0.0.0)
          echo "本地版本 $LOCAL ／ 云端版本 $REMOTE"
          echo "### v$LOCAL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::warning title=版本未提升::Cargo.toml 仍是 $LOCAL，本次会重发同一版本号，客户端不会弹出更新。要发新功能请先 bump Cargo.toml 两处 version。"
          fi

      - name: 导入签名身份（可选）
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64:-}" ]; then
            echo "::warning title=未配置签名证书::未设置 MACOS_CERT_P12，本次走 ad-hoc 签名，用户首次运行需重新授权辅助功能/输入监控"
            exit 0
          fi
          KC="$RUNNER_TEMP/ci-signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # 自签名证书导出再导入后，TrustSettings 不随 p12 走，默认不被信任；
          # 而 macos-app.sh 用 `find-identity -v`（仅有效身份）检测，会把不受信的身份滤掉
          # → 静默退回 ad-hoc 签名。这里显式把它设为信任根。
          security find-certificate -c "OpenHopSign" -p "$KC" > "$RUNNER_TEMP/openhopsign.pem"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/openhopsign.pem"
          rm -f "$RUNNER_TEMP/openhopsign.pem" "$RUNNER_TEMP/signing.p12"
          echo "--- 可用签名身份 ---"
          security find-identity -v -p codesigning | tee "$RUNNER_TEMP/ids.txt"
          grep -q "OpenHopSign" "$RUNNER_TEMP/ids.txt" \
            || { echo "::error title=签名证书不可用::导入后仍看不到 OpenHopSign，请检查 MACOS_CERT_P12 / MACOS_CERT_PASSWORD"; exit 1; }

      - name: 单元测试（不阻塞发版）
        continue-on-error: true
        run: cargo test --release --lib

      - name: 构建 + 打包 + 生成 manifest
        id: build
        env:
          ISLANDHOP_NO_PUBLISH: "1"
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES="${INPUT_NOTES:-}"
          if [ -z "$NOTES" ]; then NOTES="CI 自动构建 v$VERSION"; fi
          echo "==> 出包 v$VERSION"
          bash packaging/push-update.sh "$NOTES"
          ls -la dist/

      - name: 校验签名身份
        run: |
          codesign -dvv IslandHop.app 2>&1 | tee "$RUNNER_TEMP/sig.txt" | grep -E "Authority|Identifier" || true
          if grep -q "Authority=OpenHopSign" "$RUNNER_TEMP/sig.txt"; then
            echo "✓ 使用稳定签名身份 OpenHopSign，TCC 授权可在更新后沿用"
          else
            echo "::warning::本次为 ad-hoc 签名，用户端更新后需重新授权辅助功能"
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: v${{ steps.build.outputs.version }}
          body: |
            ${{ inputs.notes }}

            macOS arm64 自动构建。服务器端 `ncsai-portal-sync.timer` 会在几分钟内把它镜像到
            `https://203.195.201.85/home/updates/islandhop/`，客户端随后自动更新。
          files: |
            dist/IslandHop-*-macos.zip
            dist/manifest.json
            dist/manifest-legacy.json
          fail_on_unmatched_files: true
          # 单独只跑 macOS（无 Windows push）时也要把该 release 标为 Latest，
          # 否则 releases/latest 停留旧版，≤旧版客户端永远提示"已是最新"（#4）。
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: IslandHop-macos-${{ github.run_number }}
          path: dist/IslandHop-*-macos.zip
          retention-days: 30
          if-no-files-found: warn
