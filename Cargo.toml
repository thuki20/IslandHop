[workspace]
resolver = "2"
members = ["crates/openhop-core"]
# vendor/* 通过 [patch.crates-io] 挂载，不是 workspace 成员；
# 显式排除后 `cargo --manifest-path vendor/<crate>/Cargo.toml` 才能独立运行（上游 ci.yml 依赖此行为）。
exclude = ["vendor"]

[workspace.package]
# 与 [package] version 保持一致：scripts/package.ps1 用「第一个 ^version =」正则取版本号。
version = "0.6.68"
edition = "2021"
license = "MIT"

[package]
name = "daozai"
version = "0.6.68"
edition = "2021"
license = "MIT"
description = "IslandHop：全量派生自岛仔的桌面岛，集成 OpenHop 局域网键鼠共享与剪贴板同步"
repository = "https://github.com/thuki20/IslandHop"
default-run = "IslandHop"

# lib crate 名保持 daozai：上游 102 个模块全部用 `daozai::` 引用，改名会全量失效。
[lib]
name = "daozai"
path = "src/lib.rs"

[[bin]]
name = "IslandHop"
path = "src/main.rs"

# 无窗口演示录制器：脚本驱动 + 软件光栅化，输出 RGBA 帧流给 ffmpeg。
[[bin]]
name = "daozai-record"
path = "src/bin/daozai-record/main.rs"
required-features = ["record"]

[features]
record = []

[patch.crates-io]
imap = { path = "vendor/imap" }
imap-proto = { path = "vendor/imap-proto" }
eframe = { path = "vendor/eframe" }
egui = { path = "vendor/egui" }
ureq = { path = "vendor/ureq" }
# IslandHop：macOS 穿透恢复瞬间 CursorLeft 清空指针位置，mouseDown 会被整体丢弃
# （岛内按钮点不动）。补丁在 MouseInput 分支用 NSEvent 全局位置兜底。
egui-winit = { path = "vendor/egui-winit" }

[dependencies]
openhop-core = { path = "crates/openhop-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
zstd = { version = "0.13.3", default-features = false }
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "0.6"
# v0.5.5 邮件：MIME 解析与验证码打分是纯逻辑，保持跨平台。
mailparse = "0.18"
regex = "1"
url = "2"
chrono = "0.4"
chrono-tz = "0.10"
rrule = "0.14.0"

# IslandHop：macOS 平台层。岛仔上游 102 个模块里 0 处 macOS 分支，
# 窗口层级 / 刘海几何需要自己接 AppKit。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 邮箱授权码 / 日历密码进 macOS 钥匙串（上游只支持 Windows 凭据管理器）。
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Linux 下 winit 至少要一个后端才能编译（只用于开发/录制，正式目标是 Windows）。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
clipboard-win = "5.4.3"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
memmap2 = "0.9.12"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_TextServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics",
  "UI_Notifications_Management",
  "UI_Notifications", "ApplicationModel",
  "Win32_System_Ole", "Win32_UI_Shell_Common", "Networking_Connectivity",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth",
  "Devices_Bluetooth", "Devices_Enumeration",
] }
# v0.5.5 邮件：IMAP 走系统 TLS，凭据进 Windows 凭据管理器。
imap = "2.4"
imap-proto = "0.10.2"
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
